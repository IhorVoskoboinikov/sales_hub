# CI на каждый pull request и push в main (раздел 12).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет ещё идущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # у setup-uv нет тега v10, только точные версии
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # у setup-uv нет тега v10, только точные версии
        with:
          enable-cache: true
      - run: uv sync --locked
      # Без --cov: unit сам по себе покрывает services/ на 37%, порог считается в integration.
      - run: uv run pytest tests/unit

  integration:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # у setup-uv нет тега v10, только точные версии
        with:
          enable-cache: true
      - run: uv sync --locked
      # Postgres, Redis и др. поднимает сам pytest через testcontainers (Docker на раннере есть).
      # Здесь и unit: пороги покрытия (раздел 10) — на общем покрытии unit + integration.
      - run: make coverage
        working-directory: .

  # Политики OPA (раздел 5): Regal, формат, строгая проверка, opa test и покрытие не ниже 90%.
  # Та же версия OPA, что в compose и testcontainers; ставить opa и regal не нужно — make запускает их в Docker.
  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - run: make policy-test REGAL_ARGS="--format github"  # замечания Regal — аннотациями в PR
