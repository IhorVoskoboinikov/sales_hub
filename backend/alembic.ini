# Alembic: миграции схемы БД. Адрес базы берётся из Settings (DATABASE_URL), не отсюда.
# Новая миграция:  uv run alembic revision --autogenerate -m "add users"
# Применить:       uv run alembic upgrade head      (или make migrate — в compose)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Имя файла начинается с даты — так миграции в папке идут по порядку.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Сгенерированную миграцию сразу форматирует ruff.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
