[project]
name = "saleshub"
version = "0.1.0"
description = "SalesHub CRM — учебный бэкенд"
requires-python = ">=3.13,<3.14"
dependencies = [
    # S3 API (RustFS локально): тянет aiohttp 3.14 — раздел 1, «Версии этапа 5».
    "aiobotocore>=3.10.0",
    # Telegram-бот (раздел 16), без extras: FSM не используется. Потолок pydantic < 2.14 —
    # раздел 1, «Версии этапа 5».
    "aiogram==3.31.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]==5.6.3",
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    # Потолок от aiogram 3.31 — раздел 1, «Версии этапа 5».
    "pydantic[email]>=2.13.5,<2.14",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    # Потолок от kombu 5.6 (Celery 5.6.3) — раздел 1, «Версии этапа 5».
    "redis>=6.4,<6.5",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff==0.17.1",
    # Без экстры redis: она требует redis-py >= 7, а модулю Redis-контейнера хватает основного redis.
    "testcontainers[postgres]>=4.15.0",
    "types-aiobotocore-s3>=3.10.0",  # типы клиента S3 для mypy
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",    # Depends(...) в аргументах по умолчанию — обычный стиль FastAPI
    "RUF001",  # кириллица в строках и комментариях — не опечатка
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["F401"]  # шаблон всегда импортирует sa и op, даже в пустой миграции

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Без аннотаций. asyncpg напрямую нужен только relay — для LISTEN (app/events/relay.py).
# aiobotocore и botocore: типы есть только у клиента S3 (types-aiobotocore-s3), сессия, конфиг
# и исключения — без них (app/storage/s3.py).
module = ["testcontainers.*", "asyncpg.*", "aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Незарегистрированный маркер, опечатка в настройке, нестрогий xfail — ошибка, а не предупреждение.
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Уровни (раздел 10): unit и integration ставятся сами по каталогу (tests/conftest.py).
    "unit: tests/unit — без Docker",
    "integration: tests/integration — настоящие Postgres, Redis, OPA и др. в testcontainers",
    "policy: код, который обязан совпадать с policies/ (routes.rego, data.yaml); make test-policy",
    "worker: задачи выполняет настоящий воркер Celery (фикстура celery_worker)",
    "committing: тест коммитит в настоящих транзакциях, мимо общей транзакции теста",
]

# Покрытие (раздел 10). Пороги — в make coverage (его вызывает job integration) на общем покрытии
# unit + integration, а не здесь: fail_under — один общий порог без разбивки по каталогам, и
# pytest-cov применил бы его к любому прогону с --cov, в том числе к частичному.
[tool.coverage.run]
source = ["app"]
# sys.monitoring: на Python 3.13 почти без накладных (ctrace — +39%) и видит строки после await
# в SQLAlchemy async (greenlet), которые ctrace без concurrency = greenlet теряет: сервис — 50%
# вместо 97%. Ни branch, ни concurrency = greenlet не добавлять: с ними sysmon на 3.13 не
# работает, и coverage молча (одним предупреждением) переключается на ctrace.
core = "sysmon"
relative_files = true

[tool.coverage.report]
skip_empty = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
